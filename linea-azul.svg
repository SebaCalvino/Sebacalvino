<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" preserveAspectRatio="none">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#A61C2E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="6" fill="url(#lineGrad)"/>
  <rect width="200" height="6" fill="url(#shineGrad)" opacity="0.9">
    <animate attributeName="x" from="-200" to="1200" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
